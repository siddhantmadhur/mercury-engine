[package]
name = "mercury_rust"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "mercury_rust"
path = "mercury/rust_modules.rs"
crate-type = ["staticlib"]

[dependencies]
cxx = "=1.0.205"
mercury_kernel = { path = "mercury/rust" }
input_actions_codegen_rs = { path = "mercury/input" }
mercury_uss = { path = "mercury/uss" }

[workspace]
members = ["mercury/rust", "mercury/input", "mercury/uss"]
resolver = "2"
