stages:
  - format
  - build

variables:
  # Wipe all untracked files (like leftover build/ folders) and dirty submodules, EXCEPT .ccache/
  GIT_CLEAN_FLAGS: -ffdxx -e .ccache/
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "5G"
  # Prebuilt toolchain image (docker/Dockerfile; build and push it with scripts/build_ci_image.pl).
  BUILD_IMAGE: "$CI_REGISTRY_IMAGE/build-env:latest"

clangformat-job:
  tags: ['us-east-2b']
  stage: format
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - echo "Linting code...."
    - git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' ':!third_party/**' ':!build/**' | xargs -r clang-format -i --style=Google
    - git diff --exit-code

verify-license-job:
  tags: ['us-east-2b']
  stage: format
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - echo "Checking for files not including LICENSE header..."
    - perl scripts/addlicenses.pl
    - git diff --exit-code

ctest-build-job:
  tags: ['us-east-2b']
  stage: build
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_CLEAN: "true"
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  cache:
    key: "ccache-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "ccache-$CI_DEFAULT_BRANCH"
    paths:
      - .ccache/
  before_script:
    - cargo fetch --manifest-path Cargo.toml --locked
  script:
    - ccache --zero-stats
    - cmake --preset release
    - cmake --build --preset check
    - ccache --show-stats