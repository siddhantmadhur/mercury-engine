clangformat-job:
  tags: ['us-east-2b']
  stage: format
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - echo "Linting code...."
    - git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' ':!third_party/**' ':!build/**' | xargs -r clang-format -i --style=Google
    - git diff --exit-code

verify-license-job:
  tags: ['us-east-2b']
  stage: format
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - echo "Checking for files not including LICENSE header..."
    - perl scripts/addlicenses.pl
    - git diff --exit-code

ctest-build-job:
  tags: ['us-east-2b']
  stage: build
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_CLEAN: "true"
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  cache:
    key: "mercury-build-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "mercury-build-$CI_DEFAULT_BRANCH"
    paths:
      - .ccache/
      - .cargo/
      - .rustup/
      - bin/dxc/
  before_script:
    # setup_project.pl invokes 'sudo apt-get' and needs perl/ca-certificates to bootstrap
    - apt-get update && apt-get install -y --no-install-recommends sudo perl ca-certificates
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - ./scripts/setup_project.pl
    - export PATH="$CARGO_HOME/bin:$PATH"
    - ccache --zero-stats
    - cmake --preset release
    - cmake --build --preset check
    - ccache --show-stats
