stages:
  - format
  - build

variables:
  # Wipe all untracked files (like build/) and dirty submodules, EXCEPT cached toolchains/ccache
  GIT_CLEAN_FLAGS: -ffdxx -e .ccache/ -e .cargo/ -e .rustup/ -e bin/dxc/
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "5G"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"

clangformat-job:
  tags: ['us-east-2b']
  stage: format
  image: ubuntu:24.04
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git wget gnupg lsb-release software-properties-common
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
    - add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
    - apt-get update && apt-get install -y --no-install-recommends clang-format-20
    - ln -sf /usr/bin/clang-format-20 /usr/bin/clang-format
  script:
    - echo "Linting code...."
    - git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' ':!third_party/**' ':!build/**' | xargs -r clang-format -i --style=Google
    - git diff --exit-code

verify-license-job:
  tags: ['us-east-2b']
  stage: format
  image: ubuntu:24.04
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git perl
  script:
    - echo "Checking for files not including LICENSE header..."
    - perl scripts/addlicenses.pl
    - git diff --exit-code

ctest-build-job:
  tags: ['us-east-2b']
  stage: build
  image: ubuntu:24.04
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_CLEAN: "true"
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  cache:
    key: "mercury-build-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "mercury-build-$CI_DEFAULT_BRANCH"
    paths:
      - .ccache/
      - .cargo/
      - .rustup/
      - bin/dxc/
  before_script:
    # setup_project.pl invokes 'sudo apt-get' and needs perl/ca-certificates to bootstrap
    - apt-get update && apt-get install -y --no-install-recommends sudo perl ca-certificates
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - ./scripts/setup_project.pl
    - export PATH="$CARGO_HOME/bin:$PATH"
    - ccache --zero-stats
    - cmake --preset release
    - cmake --build --preset check
    - ccache --show-stats