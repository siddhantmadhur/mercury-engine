stages:
  - format
  - build

# Ensure all jobs wipe untracked files (like leftover build/ folders) before starting
variables:
  GIT_CLEAN_FLAGS: -ffdx

clangformat-job:
  tags: ['us-east-2b']
  stage: format
  script:
    - echo "Linting code...."
    - git ls-files | grep -E '\.([ch](pp)?|cc)$' | grep -vE '^(third_party|build)/' | xargs -r clang-format -i --style=Google
    - git diff --exit-code

verify-license-job:
  tags: ['us-east-2b']
  stage: format
  script:
    - echo "Checking for files not including LICENSE header..."
    - mkdir -p /tmp/ci_excluded
    - '[ -d third_party ] && mv third_party /tmp/ci_excluded/'
    - perl scripts/addlicenses.pl; EXIT_CODE=$?
    - '[ -d /tmp/ci_excluded/third_party ] && mv /tmp/ci_excluded/third_party .'
    - '[ "$EXIT_CODE" -eq 0 ] || exit $EXIT_CODE'
    - git diff --exit-code

ctest-build-job:
  tags: ['us-east-2b']
  stage: build
  cache:
    key: "cmake-build-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "cmake-build-$CI_DEFAULT_BRANCH"
    paths:
      - build/
  script:
    - ./scripts/setup_project.pl
    - git submodule update --init --recursive
    - cmake --preset release
    - cmake --build --preset check