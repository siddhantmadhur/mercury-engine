stages:
  - image
  - format
  - build

variables:
  # Wipe all untracked files (like build/) and dirty submodules, EXCEPT cached toolchains/ccache
  GIT_CLEAN_FLAGS: -ffdxx -e .ccache/ -e .cargo/ -e .rustup/ -e bin/dxc/
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "5G"
  # Prebuilt toolchain image (see docker/Dockerfile and build-image-job below).
  BUILD_IMAGE: "$CI_REGISTRY_IMAGE/build-env:latest"


# Rebuilds the toolchain image and pushes it to the GitLab container registry.
# Uses kaniko so the runner needs neither privileged mode nor a Docker socket.
# Runs when docker/ changes, or manually from the pipeline page.
build-image-job:
  tags: ['us-east-2b']
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  rules:
    - changes:
        - docker/**/*
    - when: manual
      allow_failure: true
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "$CI_PROJECT_DIR/docker"
        --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile"
        --destination "$BUILD_IMAGE"
        --cache=true
        --cache-repo "$CI_REGISTRY_IMAGE/build-env/cache"

clangformat-job:
  tags: ['us-east-2b']
  stage: format
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - echo "Linting code...."
    - git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' ':!third_party/**' ':!build/**' | xargs -r clang-format -i --style=Google
    - git diff --exit-code

verify-license-job:
  tags: ['us-east-2b']
  stage: format
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - echo "Checking for files not including LICENSE header..."
    - perl scripts/addlicenses.pl
    - git diff --exit-code

ctest-build-job:
  tags: ['us-east-2b']
  stage: build
  image: $BUILD_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_CLEAN: "true"
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  cache:
    key: "mercury-build-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "mercury-build-$CI_DEFAULT_BRANCH"
    paths:
      - .ccache/
      - .cargo/
      - .rustup/
      - bin/dxc/
  before_script:
    # setup_project.pl invokes 'sudo apt-get' and needs perl/ca-certificates to bootstrap
    - apt-get update && apt-get install -y --no-install-recommends sudo perl ca-certificates
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - ./scripts/setup_project.pl
    - export PATH="$CARGO_HOME/bin:$PATH"
    - ccache --zero-stats
    - cmake --preset release
    - cmake --build --preset check
    - ccache --show-stats
