stages:
  - format
  - build

variables:
  # 1. Gives every concurrent/sequential job its own isolated build directory on the shell runner
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH_SLUG/$CI_JOB_NAME
  # 2. Tells GitLab to clean nested submodules and untracked files before every job
  GIT_CLEAN_FLAGS: -ffdxx

clangformat-job:
  tags: ['us-east-2b']
  stage: format
  variables:
    # Format jobs don't need submodules checked out at all
    GIT_SUBMODULE_STRATEGY: none
  script:
    - echo "Linting code...."
    - git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' ':!third_party/**' ':!build/**' | xargs -r clang-format -i --style=Google
    - git diff --exit-code

verify-license-job:
  tags: ['us-east-2b']
  stage: format
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - echo "Checking for files not including LICENSE header..."
    - perl scripts/addlicenses.pl
    - git diff --exit-code

ctest-build-job:
  tags: ['us-east-2b']
  stage: build
  variables:
    # Let GitLab natively init and clean submodules before the script runs
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_CLEAN: "true"
  cache:
    key: "cmake-build-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "cmake-build-$CI_DEFAULT_BRANCH"
    paths:
      - build/
  script:
    - ./scripts/setup_project.pl
    - cmake --preset release
    - cmake --build --preset check