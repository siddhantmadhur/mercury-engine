stages:          # List of stages for jobs, and their order of execution
  - format
  - build

clangformat-job:   # This job also runs in the test stage.
  tags: ['us-east-2b']
  stage: format    # It can run at the same time as unit-test-job (in parallel).
  script:
    - echo "Linting code...."
    - git ls-tree --name-only --full-name -r HEAD | grep -E '\.([ch](pp)?|cc)$' | xargs clang-format -i --style=Google
    - git diff --exit-code
    
verify-license-job:   # This job also runs in the test stage.
  tags: ['us-east-2b']
  stage: format    # It can run at the same time as unit-test-job (in parallel).
  script:
    - echo "Checking for files not including LICENSE header..."
    - perl scripts/addlicenses.pl
    - git diff --exit-code

ctest-build-job:
  tags: ['us-east-2b']
  stage: build
  script:
    - git submodule update --init --recursive
    - cmake --preset release
    - cmake --build --preset check