stages:
  - format
  - build

variables:
  # Wipe all untracked files (like leftover build/ folders) and dirty submodules, EXCEPT .ccache/
  GIT_CLEAN_FLAGS: -ffdxx -e .ccache/
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "5G"

clangformat-job:
  tags: ['us-east-2b']
  stage: format
  image: ubuntu:24.04
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git wget gnupg lsb-release software-properties-common
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
    - add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
    - apt-get update && apt-get install -y --no-install-recommends clang-format-20
    - ln -sf /usr/bin/clang-format-20 /usr/bin/clang-format
  script:
    - echo "Linting code...."
    - git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' ':!third_party/**' ':!build/**' | xargs -r clang-format -i --style=Google
    - git diff --exit-code

verify-license-job:
  tags: ['us-east-2b']
  stage: format
  image: ubuntu:24.04
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git perl
  script:
    - echo "Checking for files not including LICENSE header..."
    - perl scripts/addlicenses.pl
    - git diff --exit-code

ctest-build-job:
  tags: ['us-east-2b']
  stage: build
  image: ubuntu:24.04
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_CLEAN: "true"
    CMAKE_C_COMPILER_LAUNCHER: ccache
    CMAKE_CXX_COMPILER_LAUNCHER: ccache
  cache:
    key: "ccache-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "ccache-$CI_DEFAULT_BRANCH"
    paths:
      - .ccache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        build-essential cmake ninja-build git perl ccache pkg-config
        libvulkan-dev libglfw3-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
  script:
    - ccache --zero-stats
    - ./scripts/setup_project.pl
    - cmake --preset release
    - cmake --build --preset check
    - ccache --show-stats