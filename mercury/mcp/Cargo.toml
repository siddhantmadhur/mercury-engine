[package]
name = "mercury_mcp"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "mercury_mcp"
path = "src/lib.rs"

[dependencies]
cxx = "=1.0.205"
rmcp = { version = "=3.11.0", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = "=0.8.9"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
